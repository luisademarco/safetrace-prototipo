<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SafeTrace — Tela Standby</title>
<style>
  *{ scrollbar-width:thin; scrollbar-color:#2a2b2f transparent; }
  *::-webkit-scrollbar{ width:6px; height:6px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-corner{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:#2a2b2f; border-radius:3px; }
  *::-webkit-scrollbar-thumb:hover{ background:#3a3b3f; }


  :root{
    --bg: #000000;
    --ink: #FCFCFC;
    --accent: #9AB2E2;
    --accent-dim: rgba(154,178,226,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    min-height:100%;
    background:#1c1d20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px 0 10px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .phone{
    position:relative;
    width:375px;
    height:812px;
    background:var(--bg);
    border-radius:52px;
    overflow:hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 10px #0a0a0a, 0 0 0 11px #2a2a2a;
  }

  .screen{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .notch{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:110px;
    height:28px;
    background:#000;
    border-radius:16px;
    z-index:5;
  }

  .logo{
    font-size:46px;
    letter-spacing:-0.01em;
    line-height:1;
    user-select:none;
  }
  .logo .safe{ color:var(--ink); font-weight:700; }
  .logo .trace{ color:var(--accent); font-weight:400; }

  .wake{
    position:absolute;
    bottom:96px;
    left:50%;
    transform:translateX(-50%);
    width:60px;
    height:60px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #4a5b85, #23262b 70%);
    border:1px solid rgba(154,178,226,0.25);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02),
      0 0 22px 4px var(--accent-dim),
      inset 0 1px 1px rgba(255,255,255,0.18),
      inset 0 -6px 10px rgba(0,0,0,0.45);
    cursor:pointer;
    animation: breathe 3.6s ease-in-out infinite;
  }

  @keyframes breathe{
    0%, 100%{
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02),
        0 0 18px 3px var(--accent-dim),
        inset 0 1px 1px rgba(255,255,255,0.16),
        inset 0 -6px 10px rgba(0,0,0,0.45);
      transform:translateX(-50%) scale(1);
    }
    50%{
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 0 30px 8px var(--accent-dim),
        inset 0 1px 1px rgba(255,255,255,0.22),
        inset 0 -6px 10px rgba(0,0,0,0.45);
      transform:translateX(-50%) scale(1.035);
    }
  }

  .home-indicator{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:134px;
    height:5px;
    border-radius:3px;
    background:#3a3b3f;
  }

  @media (max-width:480px){
    body{ padding:0; }
    .phone{
      width:100vw;
      height:100vh;
      height:100dvh;
      border-radius:0;
      box-shadow:none;
    }
    .notch{ display:none; }
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="logo"><span class="safe">Safe</span><span class="trace">Trace</span></div>
      <div class="wake" onclick="window.location.href='tela-home.html'" style="cursor:pointer;"></div>
    </div>
    <div class="home-indicator"></div>
  </div>

</body>
</html>
